<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, minimum-scale=1, maximum-scale=1"
    />
    <title>Pulperia JTN</title>

    <!-- ── Información de la App ── -->
    <meta
      name="description"
      content="Sistema completo de gestión de inventario, ventas y reportes para pulpería"
    />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="color-scheme" content="light dark" />

    <!-- ── PWA Manifest ── -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── iOS específico ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pulpería JTN" />
    <meta name="apple-itunes-app" content="app-id=6737891234" />

    <!-- ── Apple Touch Icons para iOS ── -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="any" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- ── Splash screens iOS (varias resoluciones) ── -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1668x2224.png"
      media="(device-width: 834px) and (device-height: 1112px)"
    />

    <!-- ── Android específico ── -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── Cloudflare ── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- ── Splash screens iOS (más opciones) ── -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
      href="/icons/splash-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
      href="/icons/splash-750x1334.png"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>"
    />

    <!-- Fuentes -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
